</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄设置与隐私页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">设置与隐私</h1><section class="profile"><div class="avatar">👩🏻</div><div class="name"><b>林女士</b><small>家庭成员 · 主要联系人</small></div><span class="arrow">›</span></section><h2 class="section">家庭管理</h2><section class="card"><div class="row"><span class="ico">♧</span><span class="text">家庭联系人</span><span class="arrow">›</span></div><div class="row"><span class="ico">♡</span><span class="text">共享内容与隐私</span><span class="arrow">›</span></div><div class="row"><span class="ico">◷</span><span class="text">提醒设置</span><span class="arrow">›</span></div></section><h2 class="section">使用帮助</h2><section class="card"><div class="row"><span class="ico">?</span><span class="text">使用说明</span><span class="arrow">›</span></div><div class="row"><span class="ico">☏</span><span class="text">联系安龄服务</span><span class="arrow">›</span></div></section><h2 class="section">关于</h2><section class="card"><div class="row"><span class="ico">⌂</span><span class="text">关于安龄</span><span class="version">版本 1.0</span><span class="arrow">›</span></div></section></div><nav class="tabs"><div class="tab"><i>⌂</i>家庭</div><div class="tab"><i>▤</i>健康记录</div><div class="tab"><i>♡</i>日常关怀</div><div class="tab active"><i>☺</i>我的</div></nav></main><script>(function(){const elder=['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'];const family=['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html'];function go(file){location.href=file}document.addEventListener('click',function(e){const tab=e.target.closest('.tab');if(tab){const label=tab.innerText.replace(/\s/g,'').slice(1);const isFamily=location.pathname.includes('family-');const routes=isFamily?family:elder;const map={'首页':routes[0],'家庭':routes[0],'我的健康':routes[1],'健康记录':routes[1],'关怀记录':routes[2],'日常关怀':routes[2],'我的':routes[3]};if(map[label])go(map[label]);return}const back=e.target.closest('.back');if(back){if(history.length>1)history.back();else go('anling-elder-home.html');return}const b=e.target.closest('button,a');if(!b)return;const t=(b.innerText||b.textContent||'').trim();if(t.includes('平安签到')||t.includes('确认今日平安')){e.preventDefault();b.textContent='今日已签到';b.disabled=true;alert('已记录今日平安（演示）');return}if(t.includes('紧急求助')||t.includes('求助提醒')){e.preventDefault();alert('求助提醒已记录（演示）。此页面不会拨打电话或发送真实通知。');return}if(t.includes('联系')||t.includes('电话')||t.includes('拨打')){e.preventDefault();alert('当前为演示页面，尚未绑定真实电话号码。');return}if(t.includes('记录已服用')||t.includes('已服用')){e.preventDefault();b.textContent='已记录服用';b.disabled=true;return}if(b.getAttribute('href')==='#'){e.preventDefault();alert('此功能为设计演示。')}})})();</script></body></html>
