hover{transform:translateY(-1px);transition:transform .15s}</style><script>(function(){const isFamily=location.pathname.includes('family-');const routes=isFamily?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const match=[['活动','anling-elder-activity.html'],['步数','anling-elder-activity.html'],['喝水','anling-elder-water.html'],['饮水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',family?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(msg){let t=document.querySelector('.anling-toast');if(!t){t=document.createElement('div');t.className='anling-toast';t.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>t.style.display='none',1900)}document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){let node=tab.cloneNode(true);node.querySelectorAll('.tab-icon').forEach(x=>x.remove());let label=node.textContent.trim();let dest=routes[label];if(dest)location.href=dest;return}let b=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact, splay='none',1800)}document.addEventListener('click',e=>{let el=e.target.closest('.tab,[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.classList.contains('tab')){let n=el.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(i=>i.remove());let label=n.textContent.trim();location.href=label==='健康'&&fam?'anling-family-health.html':tabMap[label]||'anling-feature-detail.html?title='+encodeURIComponent(label);return}let label=(el.innerText||el.textContent||'功能详情').replace(/\s+/g,' ').trim();if(el.dataset.go){if(el.dataset.go==='record'){toast('已记录一杯水');return}if(el.dataset.go==='compose'){toast('留言功能为演示内容');return}location.href=el.dataset.go;return}if(label.includes('签到')){el.textContent='今日已签到';toast('已记录今日平安');return}if(label.includes('求助')){toast('求助功能为演示内容');return}if(label.includes('联系')){toast('演示页面尚未绑定电话号码');return}for(const [k,v] of map)if(label.includes(k)){location.href=v;return}if(el.matches('.card,.metric,.person,.contact,.more'))location.href='anling-feature-detail.html?title='+encodeURIComponent(label.slice(0,40));else toast('已记录（演示）')})})();</script></body></html>
