<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜设置与隐私</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 20px 83px;height:calc(100% - 48px);overflow:auto}.brand{font-size:19px;font-weight:750;margin:5px 0 20px}.brand small{font-size:11px;color:#758D70;margin-left:5px;font-weight:500}.title{font-size:26px;margin:0 0 17px}.profile{display:flex;align-items:center;gap:12px;background:#e7eee2;border-radius:20px;padding:16px;margin-bottom:18px}.avatar{width:49px;height:49px;border-radius:16px;background:#d8e2d1;display:grid;place-items:center;font-size:25px}.name{flex:1}.name b{font-size:17px}.name small{display:block;font-size:12px;color:#6e786c;margin-top:4px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:20px;padding:0 15px;margin-bottom:14px}.section{font-size:15px;font-weight:700;color:#69736a;margin:18px 3px 9px}.row{height:55px;display:flex;align-items:center;border-top:1px solid #eee9df;font-size:15px}.row:first-child{border-top:0}.row .ico{width:31px;height:31px;border-radius:10px;background:#eef1e9;color:#607858;display:grid;place-items:center;margin-right:10px;font-size:16px}.row .text{flex:1}.arrow{color:#9ba197;font-size:20px}.version{font-size:12px;color:#9a9d96;margin-left:8px}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}.tab{text-align:center;color:#93988f;font-size:12px;min-width:70px}.tab i{display:block;font-style:normal;font-size:21px;line-height:27px}.active{color:#536e51;font-weight:700}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄设置与隐私页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">设置与隐私</h1><section class="profile"><div class="avatar">👩🏻</div><div class="name"><b>林女士</b><small>家庭成员 · 主要联系人</small></div><span class="arrow">›</span></section><h2 class="section">家庭管理</h2><section class="card"><div class="row"><span class="ico">♧</span><span class="text">家庭联系人</span><span class="arrow">›</span></div><div class="row"><span class="ico">♡</span><span class="text">共享内容与隐私</span><span class="arrow">›</span></div><div class="row"><span class="ico">◷</span><span class="text">提醒设置</span><span class="arrow">›</span></div></section><h2 class="section">使用帮助</h2><section class="card"><div class="row"><span class="ico">?</span><span class="text">使用说明</span><span class="arrow">›</span></div><div class="row"><span class="ico">☏</span><span class="text">联系安龄服务</span><span class="arrow">›</span></div></section><h2 class="section">关于</h2><section class="card"><div class="row"><span class="ico">⌂</span><span class="text">关于安龄</span><span class="version">版本 1.0</span><span class="arrow">›</span></div></section></div><nav class="tabs"><div class="tab"><i>⌂</i>家庭</div><div class="tab"><i>▤</i>健康记录</div><div class="tab"><i>♡</i>日常关怀</div><div class="tab active"><i>☺</i>我的</div></nav></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|日常关怀/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/我的健康|健康记录|心率|血压|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/关怀记录|日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-checkin.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人|联系家人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(/设置|^我的$/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){say('求助功能为演示内容，尚未接入真实服务');return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
