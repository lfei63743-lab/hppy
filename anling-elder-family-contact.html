<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#F6F2E9"><title>安龄｜联系家人</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.phone{width:min(100vw,390px);height:min(100dvh,844px);min-height:700px;background:#F6F2E9;border:1px solid #d8d2c6;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 16px 48px #34443b22}.status{height:48px;padding:15px 24px 0;font-size:14px;font-weight:700;display:flex;justify-content:space-between}.content{height:calc(100% - 124px);overflow:auto;padding:13px 20px 20px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.top{display:flex;align-items:center;justify-content:space-between;margin:0 0 19px}.brand{font-size:19px;font-weight:800;letter-spacing:1px}.brand small{font-size:11px;color:#758D70;font-weight:500;letter-spacing:0;margin-left:5px}.back{border:1px solid #e8e3d8;background:#fffdf8;color:#536e51;border-radius:13px;padding:9px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}.eyebrow{color:#758D70;font-size:13px;margin:0 0 4px}.title{font-size:25px;line-height:1.4;margin:0;font-weight:780}.sub{font-size:13px;color:#777f75;line-height:1.65;margin:7px 0 15px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:20px;padding:15px;margin:0 0 12px;box-shadow:0 4px 14px #34443b0b}.section{font-size:17px;margin:19px 2px 10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.metric{font-size:14px;color:#727b71}.value{font-size:28px;font-weight:800;margin:8px 0 3px}.unit{font-size:12px;color:#727b71;font-weight:500;margin-left:4px}.pill{display:inline-flex;border-radius:999px;padding:6px 10px;background:#e3ecdf;color:#506a4e;font-size:12px;font-weight:650}.chart{width:100%;height:110px;display:block;margin-top:8px}.note{font-size:11px;line-height:1.6;color:#858a81;margin:10px 3px}.button{display:block;text-align:center;width:100%;border:0;border-radius:15px;background:#758D70;color:#fff;font:700 16px inherit;font-family:inherit;padding:14px;text-decoration:none;cursor:pointer}.soft{background:#e8eee3;color:#536e51;border:1px solid #d7e0d1}.list{display:flex;align-items:center;gap:12px}.badge{width:40px;height:40px;flex:none;border-radius:14px;background:#e8eee3;color:#758D70;display:grid;place-items:center;font-size:20px}.copy{flex:1}.copy b{font-size:15px;display:block}.copy small{display:block;color:#7d847b;font-size:12px;margin-top:4px}.arrow{font-size:21px;color:#758D70}.tabbar{height:76px;position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-around;background:#fffdf8;border-top:1px solid #ebe6da;padding:4px 8px 9px}.tab{text-decoration:none;min-width:70px;text-align:center;color:#858b83;font-size:11px}.tab i{display:block;font-style:normal;font-size:20px;line-height:27px}.tab.active{color:#536e51;font-weight:700}.tab.active i{margin:auto auto 2px;border-radius:12px;width:42px;background:#e7ede2}.line{height:1px;background:#eee9df;margin:11px 0}.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);background:#34443b;color:white;border-radius:14px;padding:11px 14px;font-size:13px;display:none;z-index:6;white-space:nowrap}</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>◔ ▰ ▰</span></div><div class="content"><div class="top"><a class="back" href="anling-elder-home.html">‹ 返回</a><span class="pill">老人端</span></div><p class="eyebrow">家人联系人</p><h1 class="title">联系家人</h1><p class="sub">选择通话或聊天。家人电话可填写并保存在本机。</p><section class="card"><div class="list"><span class="badge">♡</span><span class="copy"><b>女儿小林</b><small>家庭联系人</small></span></div><label class="metric" for="familyPhone" style="display:block;margin:15px 0 6px">家人电话号码</label><input id="familyPhone" type="tel" inputmode="tel" placeholder="请输入家人手机号" style="width:100%;padding:13px;border:1px solid #e1ddd3;border-radius:13px;background:#fffdf8;font:16px inherit;font-family:inherit"><div class="row" style="margin-top:10px"><button class="button soft" id="savePhone" style="width:48%">保存号码</button><button class="button" id="callFamily" style="width:48%">拨打电话</button></div></section><div class="row"><button class="button soft" id="showCall" style="width:48%">电话</button><button class="button soft" id="showChat" style="width:48%">聊天</button></div><section class="card" id="chatPanel" style="display:none;margin-top:12px"><div id="messages" style="min-height:135px;max-height:210px;overflow:auto"><div class="pill">今天也要照顾好自己呀</div><p class="metric" style="text-align:right">好，我一切都好</p></div><div class="row"><input id="chatText" placeholder="写下想说的话" style="min-width:0;flex:1;padding:12px;border:1px solid #e1ddd3;border-radius:12px;background:#fffdf8;font:14px inherit;font-family:inherit"><button class="button" id="sendChat" style="width:75px;padding:12px">发送</button></div><p class="note">聊天内容仅在本页面演示，不会发送给真实联系人。</p></section><a class="button" href="tel:120" style="margin-top:16px;background:#b86b55">紧急拨打 120</a><p class="note">请仅在需要医疗急救时拨打 120。</p></div><nav class="tabbar"><a class="tab active" href="anling-elder-home.html"><i>⌂</i>首页</a><a class="tab " href="anling-elder-health.html"><i>♡</i>我的健康</a><a class="tab " href="anling-elder-care-records.html"><i>◷</i>关怀记录</a><a class="tab " href="anling-elder-profile.html"><i>☺</i>我的</a></nav></main><script>const p=document.getElementById('familyPhone');p.value=localStorage.getItem('anling_family_phone')||'';const toast=document.querySelector('.toast');function say(s){toast.textContent=s;toast.style.display='block';setTimeout(()=>toast.style.display='none',1800)}document.getElementById('savePhone').onclick=()=>{localStorage.setItem('anling_family_phone',p.value.trim());say('家人号码已保存在本机')};document.getElementById('callFamily').onclick=()=>{const n=p.value.trim();if(!n){p.focus();say('请先填写家人电话号码');return}location.href='tel:'+encodeURIComponent(n)};document.getElementById('showCall').onclick=()=>{document.getElementById('chatPanel').style.display='none';p.focus()};document.getElementById('showChat').onclick=()=>{document.getElementById('chatPanel').style.display='block'};document.getElementById('sendChat').onclick=()=>{const i=document.getElementById('chatText');if(!i.value.trim()){say('先写一句想说的话');return}const d=document.createElement('p');d.textContent=i.value;d.style='text-align:right;color:#536e51;background:#e8eee3;padding:9px 12px;border-radius:14px;margin-left:32px';document.getElementById('messages').append(d);i.value='';say('留言已添加到本机演示页面')};</script></body></html>
