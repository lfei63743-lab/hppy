</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄家庭动态页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">家庭动态</h1><p class="sub">关心不必复杂，每一次联系都算数。</p><section class="card hero"><h2>给爸爸送上一句问候</h2><p>今天还没有联系爸爸。打个电话，听听他的声音吧。</p><button class="primary">现在联系</button></section><h2 class="section">最近的关怀</h2><section class="card"><div class="record"><div class="avatar">👨🏻</div><div class="record-copy"><b>爸爸完成了平安签到</b><p>今天早上已确认平安，状态一切顺利。</p><small>今天 08:15</small></div><span class="heart">♡</span></div></section><section class="card"><div class="record"><div class="avatar">👩🏻</div><div class="record-copy"><b>你记录了爸爸的健康信息</b><p>心率 72 bpm · 血压 126/82 mmHg</p><small>今天 08:20 · 手动录入</small></div><span class="heart">♡</span></div></section><h2 class="section">家庭联系人</h2><section class="card"><div class="contact"><span class="contact-ico">☺</span><div class="contact-copy"><b>爸爸</b><small>家庭成员 · 可联系</small></div><button class="call">拨打电话</button></div></section><section class="card quiet"><span class="contact-ico">♡</span><p><b>温和陪伴，也尊重彼此节奏</b>你可以随时调整提醒方式与家庭共享内容。</p></section><p style="font-size:11px;color:#898c83;line-height:1.5;margin:2px 4px 10px">关怀记录仅供家庭成员查看，健康内容为演示信息。</p></div><nav class="tabs"><div class="tab"><i>⌂</i>家庭</div><div class="tab"><i>▤</i>健康记录</div><div class="tab active"><i>♡</i>家庭动态</div><div class="tab"><i>☺</i>我的</div></nav></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|家庭动态/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/心率/.test(s))return f?'anling-family-measurements.html':'anling-elder-heart.html';if(/血压/.test(s))return f?'anling-family-measurements.html':'anling-elder-blood-pressure.html';if(/最近测量记录|查看全部/.test(s)&&f)return'anling-family-measurements.html';if(/联系家人|联系女儿/.test(s))return'anling-elder-family-contact.html';if(/家庭动态|家庭留言|家人留言/.test(s))return'anling-family-messages.html';if(/关怀记录/.test(s))return'anling-elder-care-records.html';if(/我的健康|健康记录|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-care-records.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(s==='我的')return f?'anling-settings.html':'anling-elder-profile.html';if(/设置/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){location.href='tel:120';return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
