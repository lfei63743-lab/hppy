<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#F6F2E9"><title>安龄｜家人留言</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:0}.phone{width:min(100vw,390px);height:min(100dvh,844px);min-height:680px;background:#F6F2E9;position:relative;overflow:hidden;box-shadow:0 14px 45px #29352d22;border:1px solid #d8d2c6;border-radius:30px}.status{height:48px;padding:15px 25px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:700}.content{height:calc(100% - 124px);overflow:auto;padding:14px 20px 18px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.brand{display:flex;justify-content:space-between;align-items:center;margin:0 0 22px;font-weight:800;font-size:18px;letter-spacing:1px}.brand small{font-size:11px;color:#758D70;font-weight:500;letter-spacing:0;margin-left:5px}.avatar{width:40px;height:40px;border-radius:14px;background:#DCE5D5;display:grid;place-items:center;font-size:21px}.eyebrow{font-size:14px;color:#758D70;margin:0 0 6px}.title{font-size:26px;line-height:1.35;margin:0;font-weight:800}.desc{font-size:14px;line-height:1.7;color:#737b71;margin:7px 0 16px}.art{height:158px;border-radius:24px;background:#e5ebdf;border:1px solid #d5dfce;display:grid;place-items:center;margin:16px 0 19px;overflow:hidden}.art svg{width:100%;height:100%}.section{font-size:18px;margin:18px 0 10px;font-weight:750}.card{width:100%;border:1px solid #ebe6da;background:#fffdf8;border-radius:19px;padding:15px;margin:0 0 11px;box-shadow:0 4px 12px #34443b0b;color:inherit;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;cursor:pointer}.feature-icon{width:44px;height:44px;border-radius:15px;background:#edf1e9;display:grid;place-items:center;font-size:22px;flex:none}.feature-copy{flex:1}.feature-copy b{font-size:16px;display:block}.feature-copy small{font-size:12px;color:#7a8178;display:block;margin-top:5px}.arrow{color:#758D70;font-size:24px}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#758D70;color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;margin:5px 0 12px}.secondary{width:100%;border:1px solid #ccd8c5;border-radius:16px;padding:14px;background:#eef2e9;color:#536e51;font:700 16px inherit;font-family:inherit;cursor:pointer;margin:4px 0}.tabbar{height:76px;position:absolute;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding:5px 10px 10px}.tab{min-width:70px;text-align:center;color:#93988f;font-size:12px;cursor:pointer}.tab-icon{font-size:20px;line-height:25px;margin-bottom:3px}.tab.active{color:#536e51;font-weight:700}.tab.active .tab-icon{background:#e6ecdf;border-radius:13px;width:44px;margin:0 auto 3px}.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#34443b;color:white;padding:12px 17px;border-radius:14px;font-size:13px;transition:.2s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.note{font-size:11px;color:#858a81;text-align:center;margin:12px 0}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>◔ ▰ ▰</span></div><div class="content"><div class="brand"><span>安龄<small>把关怀放进每一天</small></span><span class="avatar">♡</span></div><p class="eyebrow">一句问候，让牵挂有回应</p><h1 class="title">家人留言</h1><p class="desc">写下关心的话，也可以留下生活中的小提醒。</p><div class="art" role="img" aria-label="家人留言插图"><svg viewBox="0 0 390 158" xmlns="http://www.w3.org/2000/svg"><circle cx="300" cy="81" r="54" fill="#F6F2E9"/><circle cx="300" cy="81" r="35" fill="#DCE5D5"/><path d="M278 86c0-13 10-23 22-23s22 10 22 23v18h-44z" fill="#758D70"/><path d="M285 76h30M300 63v45" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/><path d="M54 60q0-12 12-12h84q12 0 12 12v42q0 12-12 12h-49l-22 17v-17h-13q-12 0-12-12z" fill="#fffdf8" stroke="#758D70" stroke-width="4"/><path d="M75 72h65M75 88h49" stroke="#9eaf96" stroke-width="5" stroke-linecap="round"/><path d="M162 48q21-17 36 0t-18 39q-39-22-18-39" fill="#E9C9B7"/><text x="55" y="40" fill="#34443B" font-size="15" font-family="sans-serif">来自家人的心意</text><path d="M20 128h350" stroke="#c8d4bf" stroke-width="2" stroke-linecap="round"/></svg></div><h2 class="section">更多关怀功能</h2><button class="card feature" data-go="compose"><span class="feature-icon">✎</span><span class="feature-copy"><b>写一条留言</b><small>把关心的话留给家人</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-contacts.html"><span class="feature-icon">⌕</span><span class="feature-copy"><b>家庭联系人</b><small>查看家庭成员</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-family-care.html"><span class="feature-icon">♡</span><span class="feature-copy"><b>日常关怀</b><small>查看关怀记录</small></span><span class="arrow">›</span></button><p class="note">页面数据为设计演示内容</p></div><nav class="tabbar"><div class="tab " data-go="anling-family-overview.html"><div class="tab-icon">⌂</div>首页</div><div class="tab " data-go="anling-family-health.html"><div class="tab-icon">♡</div>健康</div><div class="tab active" data-go="anling-family-care.html"><div class="tab-icon">▤</div>关怀</div><div class="tab" data-go="anling-settings.html"><div class="tab-icon">☺</div>我的</div></nav><div class="toast" aria-live="polite"></div></main><script>
document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){location.href=go.dataset.go;return}const toast=document.querySelector('.toast');toast.textContent='已为你记录（演示）';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)});
</script></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const fam=location.pathname.includes('family-');const tabMap={'首页':'anling-elder-home.html','家庭':'anling-family-overview.html','健康':'anling-elder-health.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'};const map=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['留言','anling-family-messages.html'],['联系人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',fam?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(s){let x=document.querySelector('.anling-toast');if(!x){x=document.createElement('div');x.className='anling-toast';x.style='position:fixed;z-index:999;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#34443b;color:white;font-size:14px';document.body.append(x)}x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}document.addEventListener('click',e=>{let el=e.target.closest('.tab,[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.classList.contains('tab')){let n=el.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(i=>i.remove());let label=n.textContent.trim();location.href=label==='健康'&&fam?'anling-family-health.html':tabMap[label]||'anling-feature-detail.html?title='+encodeURIComponent(label);return}let label=(el.innerText||el.textContent||'功能详情').replace(/\s+/g,' ').trim();if(el.dataset.go){if(el.dataset.go==='record'){toast('已记录一杯水');return}if(el.dataset.go==='compose'){toast('留言功能为演示内容');return}location.href=el.dataset.go;return}if(label.includes('签到')){el.textContent='今日已签到';toast('已记录今日平安');return}if(label.includes('求助')){toast('求助功能为演示内容');return}if(label.includes('联系')){toast('演示页面尚未绑定电话号码');return}for(const [k,v] of map)if(label.includes(k)){location.href=v;return}if(el.matches('.card,.metric,.person,.contact,.more'))location.href='anling-feature-detail.html?title='+encodeURIComponent(label.slice(0,40));else toast('已记录（演示）')})})();</script></body></html>
