return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(s==='我的')return f?'anling-settings.html':'anling-elder-profile.html';if(/设置/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){location.href='tel:120';return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('b
