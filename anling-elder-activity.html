*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:0}.phone{width:min(100vw,390px);height:min(100dvh,844px);min-height:680px;background:#F6F2E9;position:relative;overflow:hidden;box-shadow:0 14px 45px #29352d22;border:1px solid #d8d2c6;border-radius:30px}.status{height:48px;padding:15px 25px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:700}.content{height:calc(100% - 124px);overflow:auto;padding:14px 20px 18px;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.brand{display:flex;justify-content:space-between;align-items:center;margin:0 0 22px;font-weight:800;font-size:18px;letter-spacing:1px}.brand small{font-size:11px;color:#758D70;font-weight:500;letter-spacing:0;margin-left:5px}.avatar{width:40px;height:40px;border-radius:14px;background:#DCE5D5;display:grid;place-items:center;font-size:21px}.eyebrow{font-size:14px;color:#758D70;margin:0 0 6px}.title{font-size:26px;line-height:1.35;margin:0;font-weight:800}.desc{font-size:14px;line-height:1.7;color:#737b71;margin:7px 0 16px}.art{height:158px;border-radius:24px;background:#e5ebdf;border:1px solid #d5dfce;display:grid;place-items:center;margin:16px 0 19px;overflow:hidden}.art svg{width:100%;height:100%}.section{font-size:18px;margin:18px 0 10px;font-weight:750}.card{width:100%;border:1px solid #ebe6da;background:#fffdf8;border-radius:19px;padding:15px;margin:0 0 11px;box-shadow:0 4px 12px #34443b0b;color:inherit;text-align:left;font:inherit;display:flex;align-items:center;gap:12px;cursor:pointer}.feature-icon{width:44px;height:44px;border-radius:15px;background:#edf1e9;display:grid;place-items:center;font-size:22px;flex:none}.feature-copy{flex:1}.feature-copy b{font-size:16px;display:block}.feature-copy small{font-size:12px;color:#7a8178;display:block;margin-top:5px}.arrow{color:#758D70;font-size:24px}.primary{width:100%;border:0;border-radius:17px;padding:16px;background:#758D70;color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;margin:5px 0 12px}.secondary{width:100%;border:1px solid #ccd8c5;border-radius:16px;padding:14px;background:#eef2e9;color:#536e51;font:700 16px inherit;font-family:inherit;cursor:pointer;margin:4px 0}.tabbar{height:76px;position:absolute;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding:5px 10px 10px}.tab{min-width:70px;text-align:center;color:#93988f;font-size:12px;cursor:pointer}.tab-icon{font-size:20px;line-height:25px;margin-bottom:3px}.tab.active{color:#536e51;font-weight:700}.tab.active .tab-icon{background:#e6ecdf;border-radius:13px;width:44px;margin:0 auto 3px}.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#34443b;color:white;padding:12px 17px;border-radius:14px;font-size:13px;transition:.2s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.note{font-size:11px;color:#858a81;text-align:center;margin:12px 0}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>◔ ▰ ▰</span></div><div class="content"><div class="brand"><span>安龄<small>把关怀放进每一天</small></span><span class="avatar">♡</span></div><p class="eyebrow">慢慢走，也很好</p><h1 class="title">今日活动</h1><p class="desc">记录日常步数与活动时长，按自己的节奏保持轻松活动。</p><div class="art" role="img" aria-label="今日活动插图"><svg viewBox="0 0 390 158" xmlns="http://www.w3.org/2000/svg"><circle cx="300" cy="81" r="54" fill="#F6F2E9"/><circle cx="300" cy="81" r="35" fill="#DCE5D5"/><path d="M278 86c0-13 10-23 22-23s22 10 22 23v18h-44z" fill="#758D70"/><path d="M285 76h30M300 63v45" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/><path d="M67 104l18-28 17 13 18-37" fill="none" stroke="#758D70" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="84" cy="73" r="8" fill="#E9C9B7"/><text x="53" y="51" fill="#34443B" font-size="16" font-family="sans-serif">今日步数</text><text x="53" y="119" fill="#34443B" font-size="25" font-weight="700" font-family="sans-serif">3280</text><path d="M20 128h350" stroke="#c8d4bf" stroke-width="2" stroke-linecap="round"/></svg></div><h2 class="section">更多关怀功能</h2><button class="card feature" data-go="anling-elder-health.html"><span class="feature-icon">♡</span><span class="feature-copy"><b>查看健康</b><small>看看最近的健康记录</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-elder-checkin.html"><span class="feature-icon">✓</span><span class="feature-copy"><b>平安签到</b><small>告诉家人今天一切安好</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-contacts.html"><span class="feature-icon">⌕</span><span class="feature-copy"><b>联系家人</b><small>给家人打个招呼</small></span><span class="arrow">›</span></button><p class="note">页面数据为设计演示内容</p></div><nav class="tabbar"><div class="tab active" data-go="anling-elder-home.html"><div class="tab-icon">⌂</div>首页</div><div class="tab " data-go="anling-elder-health.html"><div class="tab-icon">♡</div>健康</div><div class="tab " data-go="anling-family-care.html"><div class="tab-icon">▤</div>关怀</div><div class="tab" data-go="anling-settings.html"><div class="tab-icon">☺</div>我的</div></nav><div class="toast" aria-live="polite"></div></main></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|家庭动态/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/心率/.test(s))return f?'anling-family-measurements.html':'anling-elder-heart.html';if(/血压/.test(s))return f?'anling-family-measurements.html':'anling-elder-blood-pressure.html';if(/最近测量记录|查看全部/.test(s)&&f)return'anling-family-measurements.html';if(/联系家人|联系女儿/.test(s))return'anling-elder-family-contact.html';if(/家庭动态|家庭留言|家人留言/.test(s))return'anling-family-messages.html';if(/关怀记录/.test(s))return'anling-elder-care-records.html';if(/我的健康|健康记录|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-care-records.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(s==='我的')return f?'anling-settings.html':'anling-elder-profile.html';if(/设置/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){location.href='tel:120';return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
