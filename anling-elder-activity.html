mary{width:100%;border:0;border-radius:17px;padding:16px;background:#758D70;color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;margin:5px 0 12px}.secondary{width:100%;border:1px solid #ccd8c5;border-radius:16px;padding:14px;background:#eef2e9;color:#536e51;font:700 16px inherit;font-family:inherit;cursor:pointer;margin:4px 0}.tabbar{height:76px;position:absolute;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding:5px 10px 10px}.tab{min-width:70px;text-align:center;color:#93988f;font-size:12px;cursor:pointer}.tab-icon{font-size:20px;line-height:25px;margin-bottom:3px}.tab.active{color:#536e51;font-weight:700}.tab.active .tab-icon{background:#e6ecdf;border-radius:13px;width:44px;margin:0 auto 3px}.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#34443b;color:white;padding:12px 17px;border-radius:14px;font-size:13px;transition:.2s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.note{font-size:11px;color:#858a81;text-align:center;margin:12px 0}

</script></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const family=location.pathname.includes('family-');const tabs=family?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const routes=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-family-health.html'],['测量','anling-family-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function tip(msg){let el=document.querySelector('.anling-toast');if(!el){el=document.createElement('div');el.className='anling-toast';el.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(el)}el.textContent=msg;el.style.display='block';clearTimeout(window.__anlingTip);window.__anlingTip=setTimeout(()=>el.style.display='none',1800)}document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){const n=tab.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(x=>x.remove());const dest=tabs[n.textContent.trim()];if(dest)location.href=dest;return}const el=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!el)return;const text=(el.innerText||el.textContent||'').replace(/\\s+/g,'').trim();if(el.matches('[data-go]')){const d=el.dataset.go;if(d==='record'||d==='compose'){tip(d==='record'?'已记录一杯水':'留言功能为演示内容');return}location.href=d;return}if(text.includes('签到')||text.includes('确认今日平安')){if(el.matches('button')){el.textContent='今日已签到';el.disabled=true}tip('已记录今日平安');return}if(text.includes('紧急求助')||text.includes('发起求助')){tip('求助功能为演示内容，尚未连接真实服务');return}if(text.includes('联系')||text.includes('拨打')){tip('演示页面尚未绑定真实电话号码');return}if(text.includes('已服用')){if(el.matches('button'))el.textContent='已记录服用';tip('已记录服药');return}for(const [key,dest] of routes){if(text.includes(key)){location.href=dest;return}}if(el.matches('.card,.metric,.person,.contact,.more')){const label=(el.innerText||el.textContent||'功能详情').replace(/\\s+/g,' ').trim().slice(0,40);location.href='anling-feature-detail.html?title='+encodeURIComponent(label);return}if(el.matches('button,a'))tip('已为你记录（演示内容）')})})();</script></body></html>
