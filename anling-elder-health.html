</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄我的健康页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">我的健康</h1><p class="sub">李阿姨 · 今日记录</p><section class="card health-hero"><div class="head"><span class="label">心率</span><span class="pill">今日已记录</span></div><div class="big">72 <span>bpm</span></div><div class="meta">今天上午 8:20 · 手动记录</div></section><div class="stats"><section class="card metric"><div class="label">血压</div><div class="big">126/82</div><div class="meta">mmHg · 上午 8:20</div></section><section class="card metric"><div class="label">血氧</div><div class="big">98<span>%</span></div><div class="meta">上午 8:20</div></section></div><section class="card"><div class="head"><span class="label">近一周心率</span><span class="meta">单位：bpm</span></div><div class="week"><div class="barcol"><div class="bar" style="height:37px"></div>周四</div><div class="barcol"><div class="bar" style="height:48px"></div>周五</div><div class="barcol"><div class="bar" style="height:42px"></div>周六</div><div class="barcol"><div class="bar" style="height:54px"></div>周日</div><div class="barcol"><div class="bar" style="height:46px"></div>周一</div><div class="barcol"><div class="bar" style="height:57px"></div>周二</div><div class="barcol"><div class="bar today" style="height:51px"></div>今天</div></div></section><section class="card"><div class="label">最近记录</div><div class="rows"><div class="row"><span>血压</span><b>126/82 mmHg</b><small>今天 08:20</small></div><div class="row"><span>心率</span><b>72 bpm</b><small>今天 08:20</small></div><div class="row"><span>血氧</span><b>98%</b><small>今天 08:20</small></div></div></section><p class="note">以上为演示记录，请以实际测量为准；本页面不提供诊断建议。</p></div><nav class="tabs"><div class="tab"><i>⌂</i>首页</div><div class="tab active"><i>♡</i>我的健康</div><div class="tab"><i>◷</i>关怀记录</div><div class="tab"><i>☺</i>我的</div></nav></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|日常关怀/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/我的健康|健康记录|心率|血压|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/关怀记录|日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-checkin.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人|联系家人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(/设置|^我的$/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){say('求助功能为演示内容，尚未接入真实服务');return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
