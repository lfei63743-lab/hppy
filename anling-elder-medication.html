<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜用药提醒</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 21px 86px}.brand{font-size:19px;font-weight:750;margin:5px 0 20px}.brand small{font-size:11px;color:#758D70;margin-left:5px;font-weight:500}.title{font-size:28px;margin:0 0 5px}.sub{font-size:15px;color:#7a8178;margin:0 0 18px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:17px;margin-bottom:13px}.today{background:#e7eee2;padding:18px}.row{display:flex;align-items:center;gap:12px}.ico{width:43px;height:43px;border-radius:15px;background:#d8e2d1;color:#5d7555;display:grid;place-items:center;font-size:21px}.copy{flex:1}.copy b{font-size:16px}.copy small{display:block;color:#747d71;font-size:13px;margin-top:4px}.tag{background:#dce8d6;color:#486144;border-radius:99px;padding:7px 10px;font-size:12px}.section{font-size:19px;margin:20px 2px 10px}.med{display:flex;align-items:center;gap:12px}.med .ico{background:#f1e5da;color:#967357}.medinfo{flex:1}.medinfo b{font-size:16px}.medinfo small{display:block;color:#747b72;margin-top:5px;font-size:13px}.time{font-size:13px;color:#5e7457;font-weight:650}.done{width:100%;height:49px;border:0;border-radius:15px;background:#758D70;color:#fff;font:650 16px inherit;font-family:inherit;margin-top:14px}.hint{font-size:12px;color:#83877e;line-height:1.6;margin:14px 3px}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}.tab{text-align:center;color:#93988f;font-size:12px}.tab i{display:block;font-style:normal;font-size:21px;line-height:27px}</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄用药提醒"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">用药提醒</h1><p class="sub">按家人或医生的安排记录服药情况。</p><section class="card today"><div class="row"><span class="ico">◷</span><div class="copy"><b>上午 · 早餐后</b><small>今天共有 2 项用药提醒</small></div><span class="tag">待完成</span></div></section><h2 class="section">今天的安排</h2><section class="card"><div class="med"><span class="ico">✚</span><div class="medinfo"><b>降压药</b><small>按既定计划 · 1 次</small></div><span class="time">08:30</span></div><button class="done">记录已服用</button></section><section class="card"><div class="med"><span class="ico">✚</span><div class="medinfo"><b>维生素补充剂</b><small>按既定计划 · 1 次</small></div><span class="time">20:00</span></div></section><p class="hint">用药安排由家庭成员录入，仅作日常提醒，请遵循医生或药品说明。</p></div><nav class="tabs"><div class="tab"><i>⌂</i>首页</div><div class="tab"><i>♡</i>我的健康</div><div class="tab"><i>◷</i>关怀记录</div><div class="tab"><i>☺</i>我的</div></nav></main><script>(function(){const elder=['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'];const family=['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html'];function go(file){location.href=file}document.addEventListener('click',function(e){const tab=e.target.closest('.tab');if(tab){const label=tab.innerText.trim();const isFamily=location.pathname.includes('family-');const routes=isFamily?family:elder;const map={'首页':routes[0],'家庭':routes[0],'我的健康':routes[1],'健康记录':routes[1],'关怀记录':routes[2],'日常关怀':routes[2],'我的':routes[3]};if(map[label])go(map[label]);return}const back=e.target.closest('.back');if(back){if(history.length>1)history.back();else go('anling-elder-home.html');return}const b=e.target.closest('button,a');if(!b)return;const t=(b.innerText||b.textContent||'').trim();if(t.includes('平安签到')||t.includes('确认今日平安')){e.preventDefault();b.textContent='今日已签到';b.disabled=true;alert('已记录今日平安（演示）');return}if(t.includes('紧急求助')||t.includes('求助提醒')){e.preventDefault();alert('求助提醒已记录（演示）。此页面不会拨打电话或发送真实通知。');return}if(t.includes('联系')||t.includes('电话')||t.includes('拨打')){e.preventDefault();alert('当前为演示页面，尚未绑定真实电话号码。');return}if(t.includes('记录已服用')||t.includes('已服用')){e.preventDefault();b.textContent='已记录服用';b.disabled=true;return}if(b.getAttribute('href')==='#'){e.preventDefault();alert('此功能为设计演示。')}})})();</script></body></html>
