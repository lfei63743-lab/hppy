<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜家庭联系人</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.brand{font-size:19px;font-weight:750}.back{font-size:14px;color:#68776a}.title{font-size:26px;margin:0 0 5px}.sub{font-size:14px;color:#7a8178;line-height:1.55;margin:0 0 17px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:21px;padding:16px;margin-bottom:12px}.person{display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:17px;background:#e2e9dc;display:grid;place-items:center;font-size:24px}.info{flex:1}.info b{font-size:16px}.info small{display:block;color:#81877e;font-size:12px;margin-top:4px}.badge{font-size:11px;color:#486144;background:#dce8d6;border-radius:99px;padding:6px 9px}.chev{font-size:20px;color:#9ba197}.add{width:100%;height:53px;border:1.5px dashed #9dad95;border-radius:17px;color:#536e51;background:#edf1e9;font:650 16px inherit;font-family:inherit;margin-top:2px}.section{font-size:17px;font-weight:750;margin:21px 2px 10px}.share{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #eee9df}.share:first-child{border-top:0}.share strong{font-size:14px}.share small{display:block;color:#82877f;font-size:11px;margin-top:4px}.toggle{width:42px;height:25px;border-radius:99px;background:#758D70;padding:3px;display:flex;justify-content:flex-end}.toggle i{width:19px;height:19px;border-radius:50%;background:white}.foot{font-size:12px;color:#848980;line-height:1.6;margin:17px 3px}.bottom{position:absolute;bottom:0;left:0;right:0;height:72px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;align-items:center;justify-content:center}.done{width:calc(100% - 40px);height:48px;border:0;border-radius:15px;background:#758D70;color:white;font:650 16px inherit;font-family:inherit}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄家庭联系人页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 我的</span><span class="brand">安龄</span><span style="width:40px"></span></div><h1 class="title">家庭联系人</h1><p class="sub">添加你信任的家人，方便彼此联系和接收关怀提醒。</p><section class="card"><div class="person"><div class="avatar">👩🏻</div><div class="info"><b>小林</b><small>女儿 · 主要联系人</small></div><span class="badge">可接收提醒</span><span class="chev">›</span></div></section><section class="card"><div class="person"><div class="avatar">👨🏻</div><div class="info"><b>小明</b><small>儿子 · 家庭成员</small></div><span class="badge">可查看记录</span><span class="chev">›</span></div></section><button class="add">＋ 添加家庭联系人</button><h2 class="section">家庭共享内容</h2><section class="card"><div class="share"><div><strong>平安签到状态</strong><small>让家人知道你已平安</small></div><span class="toggle"><i></i></span></div><div class="share"><div><strong>健康记录</strong><small>共享你手动记录的健康信息</small></div><span class="toggle"><i></i></span></div><div class="share"><div><strong>求助提醒</strong><small>求助时通知主要联系人</small></div><span class="toggle"><i></i></span></div></section><p class="foot">你可以随时修改共享设置。只有你选择的家庭成员可以查看对应信息。</p></div><div class="bottom"><button class="done">保存设置</button></div></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|家庭动态/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/心率/.test(s))return f?'anling-family-measurements.html':'anling-elder-heart.html';if(/血压/.test(s))return f?'anling-family-measurements.html':'anling-elder-blood-pressure.html';if(/最近测量记录|查看全部/.test(s)&&f)return'anling-family-measurements.html';if(/联系家人|联系女儿/.test(s))return'anling-elder-family-contact.html';if(/家庭动态|家庭留言|家人留言/.test(s))return'anling-family-messages.html';if(/关怀记录/.test(s))return'anling-elder-care-records.html';if(/我的健康|健康记录|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-care-records.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(s==='我的')return f?'anling-settings.html':'anling-elder-profile.html';if(/设置/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){location.href='tel:120';return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
