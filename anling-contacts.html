<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜家庭联系人</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 20px}.brand{font-size:19px;font-weight:750}.back{font-size:14px;color:#68776a}.title{font-size:26px;margin:0 0 5px}.sub{font-size:14px;color:#7a8178;line-height:1.55;margin:0 0 17px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:21px;padding:16px;margin-bottom:12px}.person{display:flex;align-items:center;gap:12px}.avatar{width:50px;height:50px;border-radius:17px;background:#e2e9dc;display:grid;place-items:center;font-size:24px}.info{flex:1}.info b{font-size:16px}.info small{display:block;color:#81877e;font-size:12px;margin-top:4px}.badge{font-size:11px;color:#486144;background:#dce8d6;border-radius:99px;padding:6px 9px}.chev{font-size:20px;color:#9ba197}.add{width:100%;height:53px;border:1.5px dashed #9dad95;border-radius:17px;color:#536e51;background:#edf1e9;font:650 16px inherit;font-family:inherit;margin-top:2px}.section{font-size:17px;font-weight:750;margin:21px 2px 10px}.share{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-top:1px solid #eee9df}.share:first-child{border-top:0}.share strong{font-size:14px}.share small{display:block;color:#82877f;font-size:11px;margin-top:4px}.toggle{width:42px;height:25px;border-radius:99px;background:#758D70;padding:3px;display:flex;justify-content:flex-end}.toggle i{width:19px;height:19px;border-radius:50%;background:white}.foot{font-size:12px;color:#848980;line-height:1.6;margin:17px 3px}.bottom{position:absolute;bottom:0;left:0;right:0;height:72px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;align-items:center;justify-content:center}.done{width:calc(100% - 40px);height:48px;border:0;border-radius:15px;background:#758D70;color:white;font:650 16px inherit;font-family:inherit}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄家庭联系人页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 我的</span><span class="brand">安龄</span><span style="width:40px"></span></div><h1 class="title">家庭联系人</h1><p class="sub">添加你信任的家人，方便彼此联系和接收关怀提醒。</p><section class="card"><div class="person"><div class="avatar">👩🏻</div><div class="info"><b>小林</b><small>女儿 · 主要联系人</small></div><span class="badge">可接收提醒</span><span class="chev">›</span></div></section><section class="card"><div class="person"><div class="avatar">👨🏻</div><div class="info"><b>小明</b><small>儿子 · 家庭成员</small></div><span class="badge">可查看记录</span><span class="chev">›</span></div></section><button class="add">＋ 添加家庭联系人</button><h2 class="section">家庭共享内容</h2><section class="card"><div class="share"><div><strong>平安签到状态</strong><small>让家人知道你已平安</small></div><span class="toggle"><i></i></span></div><div class="share"><div><strong>健康记录</strong><small>共享你手动记录的健康信息</small></div><span class="toggle"><i></i></span></div><div class="share"><div><strong>求助提醒</strong><small>求助时通知主要联系人</small></div><span class="toggle"><i></i></span></div></section><p class="foot">你可以随时修改共享设置。只有你选择的家庭成员可以查看对应信息。</p></div><div class="bottom"><button class="done">保存设置</button></div></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><script>(function(){const isFamily=location.pathname.includes('family-');const routes=isFamily?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const match=[['活动','anling-elder-activity.html'],['步数','anling-elder-activity.html'],['喝水','anling-elder-water.html'],['饮水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量','anling-family-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(msg){let t=document.querySelector('.anling-toast');if(!t){t=document.createElement('div');t.className='anling-toast';t.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>t.style.display='none',1900)}document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){let node=tab.cloneNode(true);node.querySelectorAll('.tab-icon').forEach(x=>x.remove());let label=node.textContent.trim();let dest=routes[label];if(dest)location.href=dest;return}let b=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!b)return;let txt=(b.innerText||b.textContent||'').replace(/\s+/g,'');if(b.matches('button,a')&&(txt.includes('签到')||txt.includes('今日平安'))){b.textContent='今日已签到';b.disabled=true;toast('已记录今日平安');return}if(txt.includes('紧急求助')||txt.includes('发起求助')){toast('求助功能为演示内容，尚未连接真实服务');return}if(txt.includes('联系')||txt.includes('拨打')){toast('演示页面尚未绑定真实电话号码');return}if(txt.includes('记录已服用')||txt.includes('已服用')){b.textContent='已记录服用';toast('已记录服药');return}let dest;for(const [key,url] of match){if(txt.includes(key)){dest=url;break}}if(dest){location.href=dest;return}if(b.matches('button,a')||b.classList.contains('more'))toast('已为你记录（演示内容）')})})();</script></body></html>
