mary{width:100%;border:0;border-radius:17px;padding:16px;background:#758D70;color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;margin:5px 0 12px}.secondary{width:100%;border:1px solid #ccd8c5;border-radius:16px;padding:14px;background:#eef2e9;color:#536e51;font:700 16px inherit;font-family:inherit;cursor:pointer;margin:4px 0}.tabbar{height:76px;position:absolute;bottom:0;left:0;right:0;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding:5px 10px 10px}.tab{min-width:70px;text-align:center;color:#93988f;font-size:12px;cursor:pointer}.tab-icon{font-size:20px;line-height:25px;margin-bottom:3px}.tab.active{color:#536e51;font-weight:700}.tab.active .tab-icon{background:#e6ecdf;border-radius:13px;width:44px;margin:0 auto 3px}.toast{position:absolute;left:50%;bottom:88px;transform:translate(-50%,10px);opacity:0;pointer-events:none;background:#34443b;color:white;padding:12px 17px;border-radius:14px;font-size:13px;transition:.2s;white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.note{font-size:11px;color:#858a81;text-align:center;margin:12px 0}
</style></head><body><main class="phone"><div class="status"><span>9:41</span><span>◔ ▰ ▰</span></div><div class="content"><div class="brand"><span>安龄<small>把关怀放进每一天</small></span><span class="avatar">♡</span></div><p class="eyebrow">记得给身体补充水分</p><h1 class="title">喝水记录</h1><p class="desc">轻轻点一下，记录今天喝过的水。目标可按个人习惯调整。</p><div class="art" role="img" aria-label="喝水记录插图"><svg viewBox="0 0 390 158" xmlns="http://www.w3.org/2000/svg"><circle cx="300" cy="81" r="54" fill="#F6F2E9"/><circle cx="300" cy="81" r="35" fill="#DCE5D5"/><path d="M278 86c0-13 10-23 22-23s22 10 22 23v18h-44z" fill="#758D70"/><path d="M285 76h30M300 63v45" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/><path d="M72 52h44l-5 64H77z" fill="#d9e8dc" stroke="#758D70" stroke-width="4"/><path d="M77 87h34l-2 25H79z" fill="#9ab79b"/><path d="M142 70c0-12 15-25 15-25s15 13 15 25a15 15 0 1 1-30 0" fill="#E9C9B7"/><text x="58" y="42" fill="#34443B" font-size="15" font-family="sans-serif">今日饮水</text><text x="57" y="142" fill="#34443B" font-size="18" font-weight="700" font-family="sans-serif">已记录 4 杯</text><path d="M20 128h350" stroke="#c8d4bf" stroke-width="2" stroke-linecap="round"/></svg></div><h2 class="section">更多关怀功能</h2><button class="card feature" data-go="record"><span class="feature-icon">＋</span><span class="feature-copy"><b>记一杯水</b><small>每次饮水后轻点记录</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-elder-health.html"><span class="feature-icon">♡</span><span class="feature-copy"><b>查看健康</b><small>看看身体状态记录</small></span><span class="arrow">›</span></button><button class="card feature" data-go="anling-elder-activity.html"><span class="feature-icon">⌁</span><span class="feature-copy"><b>今日活动</b><small>查看步数与活动时长</small></span><span class="arrow">›</span></button><p class="note">页面数据为设计演示内容</p></div><nav class="tabbar"><div class="tab active" data-go="anling-elder-home.html"><div class="tab-icon">⌂</div>首页</div><div class="tab " data-go="anling-elder-health.html"><div class="tab-icon">♡</div>健康</div><div class="tab " data-go="anling-family-care.html"><div class="tab-icon">▤</div>关怀</div><div class="tab" data-go="anling-settings.html"><div class="tab-icon">☺</div>我的</div></nav><div class="toast" aria-live="polite"></div></main><script>
