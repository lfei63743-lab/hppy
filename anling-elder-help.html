<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜紧急求助</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}.back{color:#596a58;font-size:16px}.brand{font-size:19px;font-weight:750;letter-spacing:1px}.title{font-size:28px;margin:0 0 7px}.sub{font-size:16px;color:#737b71;line-height:1.6;margin:0 0 22px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:18px;margin-bottom:14px}.contact{display:flex;align-items:center;gap:13px}.avatar{width:54px;height:54px;border-radius:18px;background:#e8eee3;display:grid;place-items:center;font-size:27px}.copy{flex:1}.copy b{font-size:18px;display:block}.copy small{font-size:14px;color:#7f867c;display:block;margin-top:5px}.call{width:100%;height:58px;background:#758D70;border:0;border-radius:17px;color:white;font:700 20px inherit;font-family:inherit;margin:4px 0 10px}.secondary{width:100%;height:56px;background:#fffdf8;border:1.5px solid #b7c5ae;border-radius:17px;color:#536e51;font:700 18px inherit;font-family:inherit}.info{font-size:14px;line-height:1.65;color:#747b72;margin:16px 2px}.safe{display:flex;gap:11px;align-items:flex-start;background:#e8eee3;border-radius:18px;padding:15px;margin-top:21px;color:#586a54;font-size:14px;line-height:1.55}.safe i{font-style:normal;font-size:19px}.foot{position:absolute;bottom:28px;left:30px;right:30px;text-align:center;color:#8b8d84;font-size:12px;line-height:1.55}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄紧急求助页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 返回</span><span class="brand">安龄</span><span style="width:42px"></span></div><h1 class="title">紧急求助</h1><p class="sub">如果你现在需要帮助，可以马上联系家人。</p><section class="card contact"><div class="avatar">👩🏻</div><div class="copy"><b>女儿 小林</b><small>家庭联系人 · 主要联系人</small></div></section><button class="call">拨打女儿电话</button><button class="secondary">通知所有家庭联系人</button><div class="safe"><i>♡</i><span>按下后会通知家人你的求助状态。若遇到紧急危险，请直接拨打当地紧急电话。</span></div><p class="info">求助信息仅用于联系你设置的家庭联系人。你可以在「我的」中查看和调整联系人。</p></div><p class="foot">紧急求助功能需在设备具备通信能力时使用。</p></main><script>(function(){const elder=['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'];const family=['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html'];function go(file){location.href=file}document.addEventListener('click',function(e){const tab=e.target.closest('.tab');if(tab){const label=tab.innerText.trim();const isFamily=location.pathname.includes('family-');const routes=isFamily?family:elder;const map={'首页':routes[0],'家庭':routes[0],'我的健康':routes[1],'健康记录':routes[1],'关怀记录':routes[2],'日常关怀':routes[2],'我的':routes[3]};if(map[label])go(map[label]);return}const back=e.target.closest('.back');if(back){if(history.length>1)history.back();else go('anling-elder-home.html');return}const b=e.target.closest('button,a');if(!b)return;const t=(b.innerText||b.textContent||'').trim();if(t.includes('平安签到')||t.includes('确认今日平安')){e.preventDefault();b.textContent='今日已签到';b.disabled=true;alert('已记录今日平安（演示）');return}if(t.includes('紧急求助')||t.includes('求助提醒')){e.preventDefault();alert('求助提醒已记录（演示）。此页面不会拨打电话或发送真实通知。');return}if(t.includes('联系')||t.includes('电话')||t.includes('拨打')){e.preventDefault();alert('当前为演示页面，尚未绑定真实电话号码。');return}if(t.includes('记录已服用')||t.includes('已服用')){e.preventDefault();b.textContent='已记录服用';b.disabled=true;return}if(b.getAttribute('href')==='#'){e.preventDefault();alert('此功能为设计演示。')}})})();</script></body></html>
