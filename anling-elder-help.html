<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜紧急求助</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}.back{color:#596a58;font-size:16px}.brand{font-size:19px;font-weight:750;letter-spacing:1px}.title{font-size:28px;margin:0 0 7px}.sub{font-size:16px;color:#737b71;line-height:1.6;margin:0 0 22px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:18px;margin-bottom:14px}.contact{display:flex;align-items:center;gap:13px}.avatar{width:54px;height:54px;border-radius:18px;background:#e8eee3;display:grid;place-items:center;font-size:27px}.copy{flex:1}.copy b{font-size:18px;display:block}.copy small{font-size:14px;color:#7f867c;display:block;margin-top:5px}.call{width:100%;height:58px;background:#758D70;border:0;border-radius:17px;color:white;font:700 20px inherit;font-family:inherit;margin:4px 0 10px}.secondary{width:100%;height:56px;background:#fffdf8;border:1.5px solid #b7c5ae;border-radius:17px;color:#536e51;font:700 18px inherit;font-family:inherit}.info{font-size:14px;line-height:1.65;color:#747b72;margin:16px 2px}.safe{display:flex;gap:11px;align-items:flex-start;background:#e8eee3;border-radius:18px;padding:15px;margin-top:21px;color:#586a54;font-size:14px;line-height:1.55}.safe i{font-style:normal;font-size:19px}.foot{position:absolute;bottom:28px;left:30px;right:30px;text-align:center;color:#8b8d84;font-size:12px;line-height:1.55}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄紧急求助页面"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 返回</span><span class="brand">安龄</span><span style="width:42px"></span></div><h1 class="title">紧急求助</h1><p class="sub">如果你现在需要帮助，可以马上联系家人。</p><section class="card contact"><div class="avatar">👩🏻</div><div class="copy"><b>女儿 小林</b><small>家庭联系人 · 主要联系人</small></div></section><button class="call">拨打女儿电话</button><button class="secondary">通知所有家庭联系人</button><div class="safe"><i>♡</i><span>按下后会通知家人你的求助状态。若遇到紧急危险，请直接拨打当地紧急电话。</span></div><p class="info">求助信息仅用于联系你设置的家庭联系人。你可以在「我的」中查看和调整联系人。</p></div><p class="foot">紧急求助功能需在设备具备通信能力时使用。</p></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|日常关怀/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/我的健康|健康记录|心率|血压|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/关怀记录|日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-checkin.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人|联系家人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(/设置|^我的$/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){say('求助功能为演示内容，尚未接入真实服务');return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
