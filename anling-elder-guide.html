<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜使用帮助</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 22px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px}.back{font-size:15px;color:#68776a}.brand{font-size:19px;font-weight:750}.title{font-size:27px;margin:0 0 5px}.sub{font-size:15px;color:#7a8178;line-height:1.5;margin:0 0 18px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:17px;margin-bottom:12px}.hero{background:#e7eee2;text-align:center;padding:20px}.illustration{width:70px;height:70px;border-radius:24px;background:#d8e2d1;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}.hero b{font-size:18px}.hero p{font-size:14px;color:#697568;line-height:1.55;margin:6px 0 0}.section{font-size:18px;margin:20px 2px 10px}.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee9df}.step:first-child{border-top:0}.num{width:30px;height:30px;border-radius:11px;background:#e7eee2;color:#536e51;display:grid;place-items:center;font-weight:750;flex:none}.step b{font-size:15px}.step p{font-size:13px;color:#747b72;line-height:1.55;margin:4px 0 0}.help{background:#f6ece3;display:flex;align-items:center;gap:12px}.help i{font-style:normal;font-size:23px;color:#98745b}.help b{font-size:15px}.help small{display:block;font-size:12px;color:#7d8078;margin-top:4px}.button{width:100%;height:54px;border:0;border-radius:17px;background:#758D70;color:white;font:650 17px inherit;font-family:inherit;margin-top:4px}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄使用帮助"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 返回</span><span class="brand">安龄</span><span style="width:42px"></span></div><h1 class="title">使用帮助</h1><p class="sub">几个简单步骤，学会使用安龄。</p><section class="card hero"><div class="illustration">♡</div><b>让家人知道你平安</b><p>每天签到一次，家人就能看到你的近况。</p></section><h2 class="section">如何完成平安签到</h2><section class="card"><div class="step"><span class="num">1</span><div><b>打开首页</b><p>在首页找到绿色的「平安签到」按钮。</p></div></div><div class="step"><span class="num">2</span><div><b>轻轻点一下</b><p>选择「我今天一切都好」，完成今日签到。</p></div></div><div class="step"><span class="num">3</span><div><b>家人收到状态</b><p>家人可以看到你已平安，不会看到不必要的信息。</p></div></div></section><section class="card help"><i>☏</i><div><b>需要家人帮忙？</b><small>可以在首页联系家人，或使用紧急求助。</small></div></section><button class="button">知道了</button></div></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|家庭动态/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/心率/.test(s))return f?'anling-family-measurements.html':'anling-elder-heart.html';if(/血压/.test(s))return f?'anling-family-measurements.html':'anling-elder-blood-pressure.html';if(/最近测量记录|查看全部/.test(s)&&f)return'anling-family-measurements.html';if(/联系家人|联系女儿/.test(s))return'anling-elder-family-contact.html';if(/家庭动态|家庭留言|家人留言/.test(s))return'anling-family-messages.html';if(/关怀记录/.test(s))return'anling-elder-care-records.html';if(/我的健康|健康记录|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-care-records.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(s==='我的')return f?'anling-settings.html':'anling-elder-profile.html';if(/设置/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){location.href='tel:120';return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
