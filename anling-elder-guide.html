<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜使用帮助</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 22px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px}.back{font-size:15px;color:#68776a}.brand{font-size:19px;font-weight:750}.title{font-size:27px;margin:0 0 5px}.sub{font-size:15px;color:#7a8178;line-height:1.5;margin:0 0 18px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:17px;margin-bottom:12px}.hero{background:#e7eee2;text-align:center;padding:20px}.illustration{width:70px;height:70px;border-radius:24px;background:#d8e2d1;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}.hero b{font-size:18px}.hero p{font-size:14px;color:#697568;line-height:1.55;margin:6px 0 0}.section{font-size:18px;margin:20px 2px 10px}.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee9df}.step:first-child{border-top:0}.num{width:30px;height:30px;border-radius:11px;background:#e7eee2;color:#536e51;display:grid;place-items:center;font-weight:750;flex:none}.step b{font-size:15px}.step p{font-size:13px;color:#747b72;line-height:1.55;margin:4px 0 0}.help{background:#f6ece3;display:flex;align-items:center;gap:12px}.help i{font-style:normal;font-size:23px;color:#98745b}.help b{font-size:15px}.help small{display:block;font-size:12px;color:#7d8078;margin-top:4px}.button{width:100%;height:54px;border:0;border-radius:17px;background:#758D70;color:white;font:650 17px inherit;font-family:inherit;margin-top:4px}
</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄使用帮助"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 返回</span><span class="brand">安龄</span><span style="width:42px"></span></div><h1 class="title">使用帮助</h1><p class="sub">几个简单步骤，学会使用安龄。</p><section class="card hero"><div class="illustration">♡</div><b>让家人知道你平安</b><p>每天签到一次，家人就能看到你的近况。</p></section><h2 class="section">如何完成平安签到</h2><section class="card"><div class="step"><span class="num">1</span><div><b>打开首页</b><p>在首页找到绿色的「平安签到」按钮。</p></div></div><div class="step"><span class="num">2</span><div><b>轻轻点一下</b><p>选择「我今天一切都好」，完成今日签到。</p></div></div><div class="step"><span class="num">3</span><div><b>家人收到状态</b><p>家人可以看到你已平安，不会看到不必要的信息。</p></div></div></section><section class="card help"><i>☏</i><div><b>需要家人帮忙？</b><small>可以在首页联系家人，或使用紧急求助。</small></div></section><button class="button">知道了</button></div></main><script>(function(){const elder=['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'];const family=['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html'];function go(file){location.href=file}document.addEventListener('click',function(e){const tab=e.target.closest('.tab');if(tab){const label=tab.innerText.trim();const isFamily=location.pathname.includes('family-');const routes=isFamily?family:elder;const map={'首页':routes[0],'家庭':routes[0],'我的健康':routes[1],'健康记录':routes[1],'关怀记录':routes[2],'日常关怀':routes[2],'我的':routes[3]};if(map[label])go(map[label]);return}const back=e.target.closest('.back');if(back){if(history.length>1)history.back();else go('anling-elder-home.html');return}const b=e.target.closest('button,a');if(!b)return;const t=(b.innerText||b.textContent||'').trim();if(t.includes('平安签到')||t.includes('确认今日平安')){e.preventDefault();b.textContent='今日已签到';b.disabled=true;alert('已记录今日平安（演示）');return}if(t.includes('紧急求助')||t.includes('求助提醒')){e.preventDefault();alert('求助提醒已记录（演示）。此页面不会拨打电话或发送真实通知。');return}if(t.includes('联系')||t.includes('电话')||t.includes('拨打')){e.preventDefault();alert('当前为演示页面，尚未绑定真实电话号码。');return}if(t.includes('记录已服用')||t.includes('已服用')){e.preventDefault();b.textContent='已记录服用';b.disabled=true;return}if(b.getAttribute('href')==='#'){e.preventDefault();alert('此功能为设计演示。')}})})();</script></body></html>
