<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜使用帮助</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 22px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px}.back{font-size:15px;color:#68776a}.brand{font-size:19px;font-weight:750}.title{font-size:27px;margin:0 0 5px}.sub{font-size:15px;color:#7a8178;line-height:1.5;margin:0 0 18px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:17px;margin-bottom:12px}.hero{background:#e7eee2;text-align:center;padding:20px}.illustration{width:70px;height:70px;border-radius:24px;background:#d8e2d1;display:grid;place-items:center;font-size:34px;margin:0 auto 12px}.hero b{font-size:18px}.hero p{font-size:14px;color:#697568;line-height:1.55;margin:6px 0 0}.section{font-size:18px;margin:20px 2px 10px}.step{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #eee9df}.step:first-child{border-top:0}.num{width:30px;height:30px;border-radius:11px;background:#e7eee2;color:#536e51;display:grid;place-items:center;font-weight:750;flex:none}.step b{font-size:15px}.step p{font-size:13px;color:#747b72;line-height:1.55;margin:4px 0 0}.help{background:#f6ece3;display:flex;align-items:center;gap:12px}.help i{font-style:normal;font-size:23px;color:#98745b}.help b{font-size:15px}.help small{display:block;font-size:12px;color:#7d8078;margin-top:4px}.button{width:100%;height:54px;border:0;border-radius:17px;backg </style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄使用帮助"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="top"><span class="back">‹ 返回</span><span class="brand">安龄</span><span style="width:42px"></span></div><h1 class="title">使用帮助</h1><p class="sub">几个简单步骤，学会使用安龄。</p><section class="card hero"><div class="illustration">♡</div><b>让家人知道你平安</b><p>每天签到一次，家人就能看到你的近况。</p></section><h2 class="section">如何完成平安签到</h2><section class="card"><div class="step"><span class="num">1</span><div><b>打开首页</b><p>在首页找到绿色的「平安签到」按钮。</p></div></div><div class="step"><span class="num">2</span><div><b>轻轻点一下</b><p>选择「我今天一切都好」，完成今日签到。</p></div></div><div class="step"><span class="num">3</span><div><b>家人收到状态</b><p>家人可以看到你已平安，不会看到不必要的信息。</p></div></div></section><section class="card help"><i>☏</i><div><b>需要家人帮忙？</b><small>可以在首页联系家人，或使用紧急求助。</small></div></section><button class="button">知道了</button></div></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><script>(function(){const isFamily=location.pathname.includes('family-');const routes=isFamily?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const match=[['活动','anling-elder-activity.html'],['步数','anling-elder-activity.html'],['喝水','anling-elder-water.html'],['饮水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',family?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(msg){let t=document.querySelector('.anling-toast');if(!t){t=document.createElement('div');t.className='anling-toast';t.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>t.style.display='none',1900)}document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){let node=tab.cloneNode(true);node.querySelectorAll('.tab-icon').forEach(x=>x.remove());let label=node.textContent.trim();let dest=routes[label];if(dest)location.href=dest;return}let b=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!b)return;let txt=(b.innerText||b.textContent||'').replace(/\s+/g,'');if(b.matches('button,a')&&(txt.includes('签到')||txt.includes('今日平安'))){b.textContent='今日已签到';b.disabled=true;toast('已记录今日平安');return}if(txt.includes('紧急求助')||txt.includes('发起求助')){toast('求助功能为演示内容，尚未连接真实服务');return}if(txt.includes('联系')||txt.includes('拨打')){toast('演示页面尚未绑定真实电话号码');return}if(txt.includes('记录已服用')||txt.includes('已服用')){b.textContent='已记录服用';toast('已记录服药');return}let dest;for(const [key,url] of match){if(txt.includes(key)){dest=url;break}}if(dest){location.href=dest;return}if(b.matches('button,a')||b.classList.contains('more'))toast('已为你记录（演示内容）')})})();</script><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const fam=location.pathname.includes('family-');const tabMap={'首页':'anling-elder-home.html','家庭':'anling-family-overview.html','健康':'anling-elder-health.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'};const map=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['留言','anling-family-messages.html'],['联系人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',fam?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(s){let x=document.querySelector('.anling-toast');if(!x){x=document.createElement('div');x.className='anling-toast';x.style='position:fixed;z-index:999;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#34443b;color:white;font-size:14px';document.body.append(x)}x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}document.addEventListener('click',e=>{let el=e.target.closest('.tab,[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.classList.contains('tab')){let n=el.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(i=>i.remove());let label=n.textContent.trim();location.href=label==='健康'&&fam?'anling-family-health.html':tabMap[label]||'anling-feature-detail.html?title='+encodeURIComponent(label);return}let label=(el.innerText||el.textContent||'功能详情').replace(/\s+/g,' ').trim();if(el.dataset.go){if(el.dataset.go==='record'){toast('已记录一杯水');return}if(el.dataset.go==='compose'){toast('留言功能为演示内容');return}location.href=el.dataset.go;return}if(label.includes('签到')){el.textContent='今日已签到';toast('已记录今日平安');return}if(label.includes('求助')){toast('求助功能为演示内容');return}if(label.includes('联系')){toast('演示页面尚未绑定电话号码');return}for(const [k,v] of map)if(label.includes(k)){location.href=v;return}if(el.matches('.card,.metric,.person,.contact,.more'))location.href='anling-feature-detail.html?title='+encodeURIComponent(label.slice(0,40));else toast('已记录（演示）')})})();</script></body></html>
