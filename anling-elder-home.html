<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>安龄｜老人端首页</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33;border:1px solid #d8d2c6}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.status-icons{letter-spacing:2px}.content{padding:8px 22px 92px;height:calc(100% - 48px);overflow:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.topline{display:flex;align-items:center;justify-content:space-between;margin:5px 0 22px}.brand{font-size:19px;font-weight:750;letter-spacing:1px}.brand small{font-size:11px;font-weight:500;letter-spacing:1px;color:#758D70;margin-left:5px}.avatar{height:42px;width:42px;border-radius:50%;background:#DCE5D5;display:grid;place-items:center;font-size:22px}.greeting{font-size:15px;color:#758D70;margin:0 0 5px}.title{font-size:29px;line-height:1.35;margin:0;font-weight:750;letter-spacing:.5px}.date{font-size:14px;color:#777f75;margin:8px 0 18px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 5px 16px #34443b0b}.safety{background:#E7EEE2;padding:18px 18px 17px}.card-head{display:flex;align-items:center;justify-content:space-between}.label{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700}.icon{width:36px;height:36px;border-radius:12px;background:#d5e0ce;display:grid;place-items:center;color:#536e51;font-size:20px}.pill{border-radius:999px;padding:7px 11px;background:#dce8d6;color:#486144;font-size:13px;font-weight:650}.desc{font-size:15px;color:#566257;margin:13px 0 16px;line-height:1.5}.check{height:56px;background:#758D70;color:#fff;border:0;border-radius:16px;font-family:inherit;font-weight:700;font-size:20px;width:100%;letter-spacing:.3px}.section-title{font-size:20px;font-weight:750;margin:21px 2px 11px}.health{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{padding:15px 14px 13px;min-height:111px}.metric-top{display:flex;align-items:center;gap:7px;color:#69766b;font-size:14px}.metric-icon{width:25px;height:25px;border-radius:9px;background:#eef1e9;display:grid;place-items:center;color:#758D70;font-size:15px}.metric-value{font-size:25px;font-weight:750;margin-top:9px;letter-spacing:-.3px}.metric-value span{font-size:13px;font-weight:550;color:#687369;margin-left:3px}.metric-note{font-size:12px;color:#8a9087;margin-top:4px}.note{font-size:12px;color:#83877e;margin:0 2px 18px}.contact{display:flex;align-items:center;gap:12px;padding:15px 16px}.contact .icon{background:#f3e4d9;color:#916d58}.contact-copy{flex:1}.contact-title{font-size:17px;font-weight:700}.contact-desc{font-size:13px;color:#82877e;margin-top:4px}.chevron{font-size:23px;color:#9ba197}.emergency{width:100%;height:54px;border:1.5px solid #cf9d81;color:#986d54;background:#f8eee7;border-radius:17px;font-family:inherit;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;margin-top:2px}.tabbar{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding:5px 20px 12px}.tab{min-width:72px;text-align:center;color:#93988f;font-size:12px}.tab .tab-icon{font-size:21px;line-height:25px;margin-bottom:3px}.tab.active{color:#536e51;font-weight:700}.tab.active .tab-icon{background:#e6ecdf;border-radius:13px;width:48px;margin:0 auto 3px}.sr{position:absolute;left:-10000px}
</style>
<style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head>
<body>
<main class="phone" aria-label="安龄老人端首页">
  <div class="status"><span>9:41</span><span class="status-icons">● ︱▰</span></div>
  <div class="content">
    <div class="topline"><div class="brand">安龄<small>家庭健康关怀</small></div><div class="avatar" aria-label="个人头像">👵</div></div>
    <p class="greeting">早上好，今天也要照顾好自己</p>
    <h1 class="title">李阿姨，早上好</h1>
    <p class="date">星期三 · 10月22日</p>
    <section class="card safety">
      <div class="card-head"><div class="label"><span class="icon">⌂</span><span>今日平安</span></div><span class="pill">等待签到</span></div>
      <p class="desc">点一下告诉家人：我今天一切都好。</p>
      <button class="check">平安签到</button>
    </section>
    <h2 class="section-title">今日健康</h2>
    <div class="health">
      <section class="card metric"><div class="metric-top"><span class="metric-icon">♥</span>心率</div><div class="metric-value">72<span>bpm</span></div><div class="metric-note">今日记录 · 上午 8:20</div></section>
      <section class="card metric"><div class="metric-top"><span class="metric-icon">⌁</span>血压</div><div class="metric-value">126/82</div><div class="metric-note">mmHg · 上午 8:20</div></section>
    </div>
    <p class="note">以上为演示记录，需手动录入，不代表设备实时测量。</p>
    <section class="card contact"><span class="icon">♡</span><div class="contact-copy"><div class="contact-title">联系家人</div><div class="contact-desc">给女儿打个电话，聊聊天</div></div><span class="chevron">›</span></section>
    <button class="emergency"><span>✚</span>紧急求助</button>
  </div>
  <nav class="tabbar" aria-label="底部导航"><div class="tab active"><div class="tab-icon">⌂</div>首页</div><div class="tab"><div class="tab-icon">♡</div>我的健康</div><div class="tab"><div class="tab-icon">◷</div>关怀记录</div><div class="tab"><div class="tab-icon">☺</div>我的</div></nav>
</main>
<style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const fam=location.pathname.includes('family-');const tabMap={'首页':'anling-elder-home.html','家庭':'anling-family-overview.html','健康':'anling-elder-health.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'};const map=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['留言','anling-family-messages.html'],['联系人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',fam?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(s){let x=document.querySelector('.anling-toast');if(!x){x=document.createElement('div');x.className='anling-toast';x.style='position:fixed;z-index:999;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#34443b;color:white;font-size:14px';document.body.append(x)}x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}document.addEventListener('click',e=>{let el=e.target.closest('.tab,[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.classList.contains('tab')){let n=el.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(i=>i.remove());let label=n.textContent.trim();location.href=label==='健康'&&fam?'anling-family-health.html':tabMap[label]||'anling-feature-detail.html?title='+encodeURIComponent(label);return}let label=(el.innerText||el.textContent||'功能详情').replace(/\s+/g,' ').trim();if(el.dataset.go){if(el.dataset.go==='record'){toast('已记录一杯水');return}if(el.dataset.go==='compose'){toast('留言功能为演示内容');return}location.href=el.dataset.go;return}if(label.includes('签到')){el.textContent='今日已签到';toast('已记录今日平安');return}if(label.includes('求助')){toast('求助功能为演示内容');return}if(label.includes('联系')){toast('演示页面尚未绑定电话号码');return}for(const [k,v] of map)if(label.includes(k)){location.href=v;return}if(el.matches('.card,.metric,.person,.contact,.more'))location.href='anling-feature-detail.html?title='+encodeURIComponent(label.slice(0,40));else toast('已记录（演示）')})})();</script></body>
</html>
