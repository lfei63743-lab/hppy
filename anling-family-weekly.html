<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜家庭健康周报</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 20px 86px;height:calc(100% - 48px);overflow:auto}.brand{font-size:19px;font-weight:750;margin:5px 0 18px}.brand small{font-size:11px;color:#758D70;margin-left:5px;font-weight:500}.title{font-size:26px;margin:0 0 5px}.sub{font-size:13px;color:#7a8178;margin:0 0 16px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:21px;padding:16px;margin-bottom:12px}.hero{background:#e7eee2}.hero small{font-size:12px;color:#697568}.hero strong{display:block;font-size:24px;margin-top:7px}.hero p{font-size:13px;color:#687365;line-height:1.55;margin:7px 0 0}.section{font-size:17px;margin:18px 2px 9px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#7d847a}.chart{width:100%;height:94px;display:block;margin-top:8px}.legend{font-size:11px;color:#70796f;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;background:#758D70;border-radius:50%;margin:0 5px 0 11px}.dot:first-child{margin-left:0}.item{display:flex;justify-content:space-between;border-top:1px solid #eee9df;padding:11px 0;font-size:13px}.item:first-of-type{border:0}.tag{border-radius:99px;background:#dce8d6;color:#486144;padding:5px 8px;font-size:11px}.foot{font-size:11px;color:#858a81;line-height:1.55;margin:4px}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}.tab{text-align:center;color:#93988f;font-size:12px}.tab i{display:block;font-style:normal;font-size:21px;line-height:27px}</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄家庭健康周报"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">家庭健康周报</h1><p class="sub">爸爸 · 10月16日—10月22日</p><section class="card hero"><small>本周平安签到</small><strong>6 天</strong><p>本周大多数日子都完成了签到，记得继续送上关心。</p></section><h2 class="section">健康记录概览</h2><div class="statgrid"><section class="card stat"><b>5 次</b><span>健康记录</span></section><section class="card stat"><b>72 bpm</b><span>最近心率记录</span></section></div><h2 class="section">一周变化</h2><section class="card"><div style="font-size:14px;font-weight:700">心率记录 <span style="font-size:11px;color:#858b82;font-weight:400">单位：bpm</span></div><svg class="chart" viewBox="0 0 320 94" aria-label="一周记录示意图"><g stroke="#eeeae1"><path d="M12 20H312M12 48H312M12 76H312"/></g><path d="M16 54 C36 46 47 56 65 49 S90 52 108 42 S134 50 152 44 S177 49 195 41 S218 45 237 39 S264 46 282 37 S300 40 310 34" fill="none" stroke="#758D70" stroke-width="3" stroke-linecap="round"/></svg><div class="legend"><i class="dot"></i>每日手动记录</div></section><h2 class="section">本周关怀</h2><section class="card"><div class="item"><span>平安签到</span><span class="tag">已记录 6 天</span></div><div class="item"><span>健康记录</span><span class="tag">共 5 条</span></div><div class="item"><span>待跟进事项</span><span style="color:#758D70">暂无</span></div></section><p class="foot">周报内容为演示信息，健康记录由家庭成员手动录入，不构成诊断建议。</p></div><nav class="tabs"><div class="tab">⌂<br>家庭</div><div class="tab">▤<br>健康记录</div><div class="tab">♡<br>日常关怀</div><div class="tab">☺<br>我的</div></nav></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card{touch-action:manipulation}</style><script>(function(){const path=location.pathname;function fam(){if(path.includes('family-'))return true;return [...document.querySelectorAll('.tab')].some(t=>/家庭|健康记录|日常关怀/.test(t.textContent||''))}function say(s){let n=document.querySelector('.anling-toast');if(!n){n=document.createElement('div');n.className='anling-toast';n.style='position:fixed;z-index:9999;bottom:94px;left:50%;transform:translateX(-50%);background:#34443b;color:#fff;padding:12px 16px;border-radius:14px;font-size:14px';document.body.appendChild(n)}n.textContent=s;n.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>n.style.display='none',1800)}function clean(s){return(s||'').replace(/\s+/g,'').replace(/[⌂▤♡☺›⌕⌁✓＋✎◷]/g,'')}function dest(s,f){s=clean(s);if(/家庭总览|家庭健康总览|爸爸的健康状态|首页|家庭/.test(s))return f?'anling-family-overview.html':'anling-elder-home.html';if(/我的健康|健康记录|心率|血压|测量|健康/.test(s))return f?'anling-family-health.html':'anling-elder-health.html';if(/平安签到|签到/.test(s))return'anling-elder-checkin.html';if(/关怀记录|日常关怀|关怀/.test(s))return f?'anling-family-care.html':'anling-elder-checkin.html';if(/步数|活动/.test(s))return'anling-elder-activity.html';if(/喝水|饮水/.test(s))return'anling-elder-water.html';if(/用药|服药/.test(s))return'anling-family-medication.html';if(/留言|消息/.test(s))return'anling-family-messages.html';if(/联系人|联系家人/.test(s))return'anling-contacts.html';if(/周报/.test(s))return'anling-family-weekly.html';if(/居家安全|提醒/.test(s))return'anling-family-reminders.html';if(/帮助/.test(s))return'anling-elder-guide.html';if(/求助/.test(s))return'anling-elder-help.html';if(/设置|^我的$/.test(s))return'anling-settings.html';return null}document.addEventListener('click',function(e){const t=e.target.closest('.tab');if(t){const group=[...document.querySelectorAll('.tab')],i=group.indexOf(t),f=fam();const explicit=t.getAttribute('data-go');if(explicit&&explicit.endsWith('.html')){location.href=explicit;return}const n=t.cloneNode(true);n.querySelectorAll('.tab-icon,.icon,svg,i').forEach(x=>x.remove());const label=n.textContent.trim();const target=dest(label,f)||(f?['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html']:['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'])[i];if(target)location.href=target;return}const el=e.target.closest('[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.dataset.go){if(el.dataset.go==='record'){el.textContent='已记录一杯水';say('已记录一杯水');return}if(el.dataset.go==='compose'){say('留言功能为演示内容');return}location.href=el.dataset.go;return}const s=(el.innerText||el.textContent||'功能详情').trim();const card=el.matches('.card,.metric,.person,.contact,.more');if(el.matches('a')&&el.getAttribute('href')&&el.getAttribute('href')!=='#')return;if(card){location.href=dest(s,fam())||'anling-feature-detail.html?title='+encodeURIComponent(s.slice(0,40));return}if(/紧急求助|发起求助/.test(s)){say('求助功能为演示内容，尚未接入真实服务');return}if(/联系|拨打/.test(s)){say('演示页面尚未绑定真实电话号码');return}if(/签到/.test(s)){el.textContent='今日已签到';say('已记录今日平安');return}const target=dest(s,fam());if(target){location.href=target;return}if(el.matches('button,a'))say('已记录（演示内容）')},true)})();</script></body></html>
