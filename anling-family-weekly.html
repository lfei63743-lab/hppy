<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安龄｜家庭健康周报</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;background:#F6F2E9;border-radius:34px;overflow:hidden;position:relative;box-shadow:0 22px 70px #29352d33}.status{height:48px;padding:16px 28px 0;display:flex;justify-content:space-between;font-size:14px;font-weight:650}.content{padding:8px 20px 86px;height:calc(100% - 48px);overflow:auto}.brand{font-size:19px;font-weight:750;margin:5px 0 18px}.brand small{font-size:11px;color:#758D70;margin-left:5px;font-weight:500}.title{font-size:26px;margin:0 0 5px}.sub{font-size:13px;color:#7a8178;margin:0 0 16px}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:21px;padding:16px;margin-bottom:12px}.hero{background:#e7eee2}.hero small{font-size:12px;color:#697568}.hero strong{display:block;font-size:24px;margin-top:7px}.hero p{font-size:13px;color:#687365;line-height:1.55;margin:7px 0 0}.section{font-size:17px;margin:18px 2px 9px}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:#7d847a}.chart{width:100%;height:94px;display:block;margin-top:8px}.legend{font-size:11px;color:#70796f;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;background:#758D70;border-radius:50%;margin:0 5px 0 11px}.dot:first-child{margin-left:0}.item{display:flex;justify-content:space-between;border-top:1px solid #eee9df;padding:11px 0;font-size:13px}.item:first-of-type{border:0}.tag{border-radius:99px;background:#dce8d6;color:#486144;padding:5px 8px;font-size:11px}.foot{font-size:11px;color:#858a81;line-height:1.55;margin:4px}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fffdf8;border-top:1px solid #ede8dd;display:flex;justify-content:space-around;align-items:center;padding-bottom:8px}.tab{text-align:center;color:#93988f;font-size:12px}.tab i{display:block;font-style:normal;font-size:21px;line-height:27px}</style><style id="mobile-fit">@media(max-width:600px){html,body{width:100%;height:100%;min-height:100%;margin:0!important;padding:0!important;display:block!important;overflow:hidden;background:#F6F2E9!important}.phone{width:100vw!important;height:100dvh!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}.content{height:calc(100% - 48px)!important;overflow:auto!important}.tabbar{padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}}</style></head><body><main class="phone" aria-label="安龄家庭健康周报"><div class="status"><span>9:41</span><span>● ︱▰</span></div><div class="content"><div class="brand">安龄<small>家庭健康关怀</small></div><h1 class="title">家庭健康周报</h1><p class="sub">爸爸 · 10月16日—10月22日</p><section class="card hero"><small>本周平安签到</small><strong>6 天</strong><p>本周大多数日子都完成了签到，记得继续送上关心。</p></section><h2 class="section">健康记录概览</h2><div class="statgrid"><section class="card stat"><b>5 次</b><span>健康记录</span></section><section class="card stat"><b>72 bpm</b><span>最近心率记录</span></section></div><h2 class="section">一周变化</h2><section class="card"><div style="font-size:14px;font-weight:700">心率记录 <span style="font-size:11px;color:#858b82;font-weight:400">单位：bpm</span></div><svg class="chart" viewBox="0 0 320 94" aria-label="一周记录示意图"><g stroke="#eeeae1"><path d="M12 20H312M12 48H312M12 76H312"/></g><path d="M16 54 C36 46 47 56 65 49 S90 52 108 42 S134 50 152 44 S177 49 195 41 S218 45 237 39 S264 46 282 37 S300 40 310 34" fill="none" stroke="#758D70" stroke-width="3" stroke-linecap="round"/></svg><div class="legend"><i class="dot"></i>每日手动记录</div></section><h2 class="section">本周关怀</h2><section class="card"><div class="item"><span>平安签到</span><span class="tag">已记录 6 天</span></div><div class="item"><span>健康记录</span><span class="tag">共 5 条</span></div><div class="item"><span>待跟进事项</span><span style="color:#758D70">暂无</span></div></section><p class="foot">周报内容为演示信息，健康记录由家庭成员手动录入，不构成诊断建议。</p></div><nav class="tabs"><div class="tab">⌂<br>家庭</div><div class="tab">▤<br>健康记录</div><div class="tab">♡<br>日常关怀</div><div class="tab">☺<br>我的</div></nav></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><script>(function(){const isFamily=location.pathname.includes('family-');const routes=isFamily?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const match=[['活动','anling-elder-activity.html'],['步数','anling-elder-activity.html'],['喝水','anling-elder-water.html'],['饮水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量','anling-family-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(msg){let t=document.querySelector('.anling-toast');if(!t){t=document.createElement('div');t.className='anling-toast';t.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>t.style.display='none',1900)}document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){let node=tab.cloneNode(true);node.querySelectorAll('.tab-icon').forEach(x=>x.remove());let label=node.textContent.trim();let dest=routes[label];if(dest)location.href=dest;return}let b=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!b)return;let txt=(b.innerText||b.textContent||'').replace(/\s+/g,'');if(b.matches('button,a')&&(txt.includes('签到')||txt.includes('今日平安'))){b.textContent='今日已签到';b.disabled=true;toast('已记录今日平安');return}if(txt.includes('紧急求助')||txt.includes('发起求助')){toast('求助功能为演示内容，尚未连接真实服务');return}if(txt.includes('联系')||txt.includes('拨打')){toast('演示页面尚未绑定真实电话号码');return}if(txt.includes('记录已服用')||txt.includes('已服用')){b.textContent='已记录服用';toast('已记录服药');return}let dest;for(const [key,url] of match){if(txt.includes(key)){dest=url;break}}if(dest){location.href=dest;return}if(b.matches('button,a')||b.classList.contains('more'))toast('已为你记录（演示内容）')})})();</script></body></html>
