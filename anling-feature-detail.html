<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#F6F2E9"><title>安龄｜功能详情</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e8e5de;color:#34443B;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.phone{width:min(100vw,390px);height:min(100dvh,844px);min-height:680px;background:#F6F2E9;border:1px solid #d8d2c6;border-radius:30px;overflow:hidden;box-shadow:0 14px 45px #29352d22;position:relative}.status{height:48px;padding:15px 25px 0;font-size:14px;font-weight:700}.content{height:calc(100% - 48px);overflow:auto;padding:20px}.back{border:0;background:#fffdf8;border:1px solid #ebe6da;border-radius:13px;padding:9px 13px;color:#536e51;font:600 14px inherit;font-family:inherit}.brand{margin:18px 0 16px;color:#758D70;font-weight:750}.title{font-size:27px;line-height:1.35;margin:0 0 10px}.desc{color:#737b71;font-size:14px;line-height:1.8}.art{height:170px;margin:20px 0;background:#e5ebdf;border:1px solid #d5dfce;border-radius:23px;display:grid;place-items:center}.art svg{width:90%;height:90%}.card{background:#fffdf8;border:1px solid #ebe6da;border-radius:19px;padding:16px;margin:11px 0}.card b{display:block;margin-bottom:7px}.card p{font-size:13px;line-height:1.7;color:#737b71;margin:0}.primary{width:100%;padding:15px;background:#758D70;border:0;border-radius:16px;color:white;font:700 16px inherit;font-family:inherit;margin-top:12px}.note{text-align:center;color:#8a8e86;font-size:11px;margin-top:16px}</style></head><body><main class="phone"><div class="status">9:41 <span style="float:right">◔ ▰ ▰</span></div><div class="content"><button class="back" onclick="history.length>1?history.back():location.href='index.html'">‹ 返回上一页</button><div class="brand">安龄 · 家庭关怀</div><h1 class="title" id="title">功能详情</h1><p class="desc">这里汇总与此功能相关的信息，方便老人查看，也让家人了解日常情况。</p><div class="art"><svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg"><circle cx="150" cy="75" r="58" fill="#DCE5D5"/><path d="M150 38c-25 0-42 19-42 42v32h84V80c0-23-17-42-42-42" fill="#758D70"/><circle cx="150" cy="38" r="21" fill="#E9C9B7"/><path d="M125 80h50M150 58v52" stroke="#fffdf8" stroke-width="4" stroke-linecap="round"/></svg></div><section class="card"><b>功能说明</b><p id="copy">此页面为功能演示，可用于记录和查看家庭日常关怀信息。</p></section><section class="card"><b>温馨提示</b><p>内容为演示数据，不代表真实医疗设备或紧急服务已连接。</p></section><button class="primary" onclick="history.length>1?history.back():location.href='index.html'">返回功能页面</button><p class="note">安龄，让关怀更简单</p></div></main><script>const q=new URLSearchParams(location.search);const title=q.get('title')||'功能详情';document.getElementById('title').textContent=title;document.title='安龄｜'+title;document.getElementById('copy').textContent='已打开“'+title+'”相关内容。此功能当前为交互演示，记录仅保存在页面状态中。';</script><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const fam=location.pathname.includes('family-');const tabMap={'首页':'anling-elder-home.html','家庭':'anling-family-overview.html','健康':'anling-elder-health.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'};const map=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['留言','anling-family-messages.html'],['联系人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量',fam?'anling-family-health.html':'anling-elder-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(s){let x=document.querySelector('.anling-toast');if(!x){x=document.createElement('div');x.className='anling-toast';x.style='position:fixed;z-index:999;bottom:90px;left:50%;transform:translateX(-50%);padding:12px 16px;border-radius:14px;background:#34443b;color:white;font-size:14px';document.body.append(x)}x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}document.addEventListener('click',e=>{let el=e.target.closest('.tab,[data-go],button,a,.card,.metric,.person,.contact,.more');if(!el)return;if(el.classList.contains('tab')){let n=el.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(i=>i.remove());let label=n.textContent.trim();location.href=label==='健康'&&fam?'anling-family-health.html':tabMap[label]||'anling-feature-detail.html?title='+encodeURIComponent(label);return}let label=(el.innerText||el.textContent||'功能详情').replace(/\s+/g,' ').trim();if(el.dataset.go){if(el.dataset.go==='record'){toast('已记录一杯水');return}if(el.dataset.go==='compose'){toast('留言功能为演示内容');return}location.href=el.dataset.go;return}if(label.includes('签到')){el.textContent='今日已签到';toast('已记录今日平安');return}if(label.includes('求助')){toast('求助功能为演示内容');return}if(label.includes('联系')){toast('演示页面尚未绑定电话号码');return}for(const [k,v] of map)if(label.includes(k)){location.href=v;return}if(el.matches('.card,.metric,.person,.contact,.more'))location.href='anling-feature-detail.html?title='+encodeURIComponent(label.slice(0,40));else toast('已记录（演示）')})})();</script></body></html>
