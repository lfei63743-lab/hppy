/i>心率</span><span><i class="dot dot杏"></i>血压变化</span><span>按日记录</span></div></section><h2 class="section">居家安全提醒</h2><section class="card"><div class="row"><span>今日平安签到</span><span class="tag">已签到 · 08:15</span></div><div class="row"><span>最近一次状态更新</span><span style="color:#727a71">今天 08:15</span></div></section><p class="note">健康数据为设计演示内容，不代表已连接真实医疗设备，也不用于诊断。</p></div><div class="bottom"><button class="action">联系爸爸，问候一下</button></div></main><script>(function(){const elder=['anling-elder-home.html','anling-elder-health.html','anling-elder-checkin.html','anling-settings.html'];const family=['anling-family-overview.html','anling-family-health.html','anling-family-care.html','anling-settings.html'];function go(file){location.href=file}document.addEventListener('click',function(e){const tab=e.target.closest('.tab');if(tab){const label=tab.innerText.replace(/\s/g,'').slice(1);const isFamily=location.pathname.includes('family-');const routes=isFamily?family:elder;const map={'首页':routes[0],'家庭':routes[0],'我的健康':routes[1],'健康记录':routes[1],'关怀记录':routes[2],'日常关怀':routes[2],'我的':routes[3]};if(map[label])go(map[label]);return}const back=e.target.closest('.back');if(back){if(history.length>1)history.back();else go('anling-elder-home.html');return}const b=e.target.closest('button,a');if(!b)return;const t=(b.innerText||b.textContent||'').trim();if(t.includes('平安签到')||t.includes('确认今日平安')){e.preventDefault();b.textContent='今日已签到';b.disabled=true;alert('已记录今日平安（演示）');return}if(t.includes('紧急求助')||t.includes('求助提醒')){e.preventDefault();alert('求助提醒已记录（演示）。此页面不会拨打电话或发送真实通知。');return}if(t.includes('联系')||t.includes('电话')||t.includes('拨打')){e.preventDefault();alert('当前为演示页面，尚未绑定真实电话号码。');return}if(t.includes('记录已服用')||t.includes('已服用')){e.preventDefault();b.textContent='已记录服用';b.disabled=true;return}if(b.getAttribute('href')==='#'){e.preventDefault();alert('此功能为设计演示。')}})})();</script></body></html>
