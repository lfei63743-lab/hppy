/i>心率</span><span><i class="dot dot杏"></i>血压变化</span><span>按日记录</span></div></section><h2 class="section">居家安全提醒</h2><section class="card"><div class="row"><span>今日平安签到</span><span class="tag">已签到 · 08:15</span></div><div class="row"><span>最近一次状态更新</span><span style="color:#727a71">今天 08:15</span></div></section><p class="note">健康数据为设计演示内容，不代表已连接真实医疗设备，也不用于诊断。</p></div><div class="bottom"><button class="action">联系爸爸，问候一下</button></div></main><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}.card:hover{transform:translateY(-1px);transition:transform .15s}</style><script>(function(){const isFamily=location.pathname.includes('family-');const routes=isFamily?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const match=[['活动','anling-elder-activity.html'],['步数','anling-elder-activity.html'],['喝水','anling-elder-water.html'],['饮水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-elder-health.html'],['测量','anling-family-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function toast(msg){let t=document.querySelector('.anling-toast');if(!t){t=document.createElement('div');t.className='anling-toast';t.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(t)}t.textContent=msg;t.style.display='block';clearTimeout(window.__anlingToast);window.__anlingToast=setTimeout(()=>t.style.display='none',1900)}document.addEventListener('click',e=>{let tab=e.target.closest('.tab');if(tab){let node=tab.cloneNode(true);node.querySelectorAll('.tab-icon').forEach(x=>x.remove());let label=node.textContent.trim();let dest=routes[label];if(dest)location.href=dest;return}let b=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!b)return;let txt=(b.innerText||b.textContent||'').replace(/\s+/g,'');if(b.matches('button,a')&&(txt.includes('签到')||txt.includes('今日平安'))){b.textContent='今日已签到';b.disabled=true;toast('已记录今日平安');return}if(txt.includes('紧急求助')||txt.includes('发起求助')){toast('求助功能为演示内容，尚未连接真实服务');return}if(txt.includes('联系')||txt.includes('拨打')){toast('演示页面尚未绑定真实电话号码');return}if(txt.includes('记录已服用')||txt.includes('已服用')){b.textContent='已记录服用';toast('已记录服药');return}let dest;for(const [key,url] of match){if(txt.includes(key)){dest=url;break}}if(dest){location.href=dest;return}if(b.matches('button,a')||b.classList.contains('more'))toast('已为你记录（演示内容）')})})();</script><style>.card,.metric,.person,.contact,.more,.tab,button,a{cursor:pointer}</style><script>(function(){const family=location.pathname.includes('family-');const tabs=family?{'家庭':'anling-family-overview.html','健康记录':'anling-family-health.html','日常关怀':'anling-family-care.html','我的':'anling-settings.html'}:{'首页':'anling-elder-home.html','我的健康':'anling-elder-health.html','健康':'anling-elder-health.html','平安签到':'anling-elder-checkin.html','我的':'anling-settings.html'};const routes=[['步数','anling-elder-activity.html'],['活动','anling-elder-activity.html'],['饮水','anling-elder-water.html'],['喝水','anling-elder-water.html'],['用药','anling-family-medication.html'],['服药','anling-family-medication.html'],['留言','anling-family-messages.html'],['消息','anling-family-messages.html'],['联系人','anling-contacts.html'],['联系家人','anling-contacts.html'],['健康','anling-family-health.html'],['测量','anling-family-health.html'],['周报','anling-family-weekly.html'],['提醒','anling-family-reminders.html'],['关怀','anling-family-care.html'],['签到','anling-elder-checkin.html'],['帮助','anling-elder-guide.html'],['求助','anling-elder-help.html'],['设置','anling-settings.html']];function tip(msg){let el=document.querySelector('.anling-toast');if(!el){el=document.createElement('div');el.className='anling-toast';el.style='position:fixed;z-index:99;bottom:95px;left:50%;transform:translateX(-50%);background:#34443b;color:white;padding:12px 16px;border-radius:14px;font-size:13px;max-width:85vw;text-align:center';document.body.appendChild(el)}el.textContent=msg;el.style.display='block';clearTimeout(window.__anlingTip);window.__anlingTip=setTimeout(()=>el.style.display='none',1800)}document.addEventListener('click',e=>{const tab=e.target.closest('.tab');if(tab){const n=tab.cloneNode(true);n.querySelectorAll('.tab-icon').forEach(x=>x.remove());const dest=tabs[n.textContent.trim()];if(dest)location.href=dest;return}const el=e.target.closest('button,a,[role=button],.card,.metric,.person,.contact,.more');if(!el)return;const text=(el.innerText||el.textContent||'').replace(/\\s+/g,'').trim();if(el.matches('[data-go]')){const d=el.dataset.go;if(d==='record'||d==='compose'){tip(d==='record'?'已记录一杯水':'留言功能为演示内容');return}location.href=d;return}if(text.includes('签到')||text.includes('确认今日平安')){if(el.matches('button')){el.textContent='今日已签到';el.disabled=true}tip('已记录今日平安');return}if(text.includes('紧急求助')||text.includes('发起求助')){tip('求助功能为演示内容，尚未连接真实服务');return}if(text.includes('联系')||text.includes('拨打')){tip('演示页面尚未绑定真实电话号码');return}if(text.includes('已服用')){if(el.matches('button'))el.textContent='已记录服用';tip('已记录服药');return}for(const [key,dest] of routes){if(text.includes(key)){location.href=dest;return}}if(el.matches('.card,.metric,.person,.contact,.more')){const label=(el.innerText||el.textContent||'功能详情').replace(/\\s+/g,' ').trim().slice(0,40);location.href='anling-featu
